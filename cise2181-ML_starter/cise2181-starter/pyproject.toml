[project]
name = "cise2181-aoi"
version = "0.1.0"
description = "CISE2181 Machine Learning, Fall 2026: small-data defect detection on MVTec AD"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.7.0",          # 2.7+ supports Blackwell GPUs (RTX PRO 4000) with CUDA 12.8
    "torchvision>=0.22.0",
    "numpy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "pillow",
    "jupyterlab",
    "ipykernel",
]

# PyTorch CUDA 12.8 builds on Windows and Linux; macOS falls back to PyPI (CPU).
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
